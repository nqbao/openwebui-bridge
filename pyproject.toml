[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openwebui-bridge"
version = "0.1.0"
description = "OpenAI streaming bridge to host-local agent sessions"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "claude-agent-sdk>=0.2.165,<0.3", "httpx>=0.28,<1", "httpx2>=2.3,<3", "mcp>=2.3,<3", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.11"]

[project.scripts]
openwebui-bridge = "openwebui_bridge.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

